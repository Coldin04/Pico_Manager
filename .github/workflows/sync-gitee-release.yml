name: Sync GitHub Releases to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync GitHub Releases to Gitee
        uses: trustedinster/sync-release-gitee@v1.3
        with:
          gitee_owner: coldin04
          gitee_repo: Pico_Manager
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          github_owner: Coldin04
          github_repo: Pico_Manager
          gitee_upload_retry_times: 3
          debug: false
